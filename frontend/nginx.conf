# File names under assets/ change with their content: cache them forever.
# Everything else is checked again on each visit, so a deploy shows at once.
map $uri $cache_control {
    default "no-cache";
    ~^/assets/ "public, max-age=31536000, immutable";
}

# Serves the built site. HTTPS and compression are left to the server's Caddy.
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    # Fills in the include of index.html's Page summary (and only that).
    ssi on;

    # Set here only: a location with its own add_header drops all of these.
    # The site and its API share one origin (Caddy sends /api/ to the backend).
    add_header Content-Security-Policy "default-src 'self'; frame-ancestors 'none'; base-uri 'none'; object-src 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # Without "always", so a missing asset is not cached.
    add_header Cache-Control $cache_control;

    # The backend is compose's "backend" service. Its name is in a variable so
    # that nginx starts even while the backend is down, and looks it up per
    # request through Docker's DNS.
    resolver 127.0.0.11 valid=10s;
    resolver_timeout 2s;
    set $backend http://backend:8000;

    # The crawler files come from the backend, which needs the visitor's Host to
    # tell the Canonical domain from the rest.
    location ~ ^/(robots\.txt|sitemap\.xml)$ {
        proxy_set_header Host $host;
        proxy_pass $backend;
    }

    # Home's Page summary, spliced into the shell (see index.html). $page_summary
    # is the include's query string, set by the Page's location below; none (any
    # other address) makes the backend answer 400, so the generic title stays.
    # An include that fails or is empty falls back to the generic title, but
    # nginx would still insert an error's body: so every error becomes an empty
    # answer.
    location = /_page-summary {
        internal;
        proxy_intercept_errors on;
        error_page 400 401 403 404 405 429 500 502 503 504 = @no_summary;
        proxy_set_header Host $host;
        # An uncompressed body, for the SSI filter to read.
        proxy_set_header Accept-Encoding "";
        proxy_connect_timeout 2s;
        proxy_read_timeout 5s;
        proxy_pass $backend/api/v1/profile/page-summary/$is_args$args;
    }

    location @no_summary {
        return 204;
    }

    location = / {
        set $page_summary "page=root";
        try_files /index.html =404;
    }

    location = /fr/ {
        set $page_summary "page=home&locale=fr";
        try_files /index.html =404;
    }

    location = /en/ {
        set $page_summary "page=home&locale=en";
        try_files /index.html =404;
    }

    # Unknown paths get the app, so client-side routes work on reload.
    location / {
        try_files $uri /index.html;
    }

    # A missing asset is a 404, not the app.
    location /assets/ {
        try_files $uri =404;
    }

    # Files from the server's media folder (the profile photo), mounted by
    # compose.yml. A missing one is a 404, so the site shows its placeholder.
    location /media/ {
        try_files $uri =404;
    }
}
