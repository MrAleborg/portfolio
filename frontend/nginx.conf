# Serves the built site. HTTPS and compression are left to the server's Caddy.
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;

    # Unknown paths get the app, so client-side routes work on reload.
    location / {
        try_files $uri $uri/ /index.html;
        # Checked again on each visit, so a deploy shows at once.
        add_header Cache-Control "no-cache";
    }

    # File names under assets/ change with their content: cache them forever.
    # A missing asset is a 404, not the app.
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
}
