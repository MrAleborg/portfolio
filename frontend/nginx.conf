# File names under assets/ change with their content: cache them forever.
# Everything else is checked again on each visit, so a deploy shows at once.
map $uri $cache_control {
    default "no-cache";
    ~^/assets/ "public, max-age=31536000, immutable";
}

# Serves the built site. HTTPS and compression are left to the server's Caddy.
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;

    # Set here only: a location with its own add_header drops all of these.
    # The site and its API share one origin (Caddy sends /api/ to the backend).
    add_header Content-Security-Policy "default-src 'self'; frame-ancestors 'none'; base-uri 'none'; object-src 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # Without "always", so a missing asset is not cached.
    add_header Cache-Control $cache_control;

    # The crawler files come from the backend (compose's "backend" service),
    # which needs the visitor's Host to tell the Canonical domain from the rest.
    # The name is in a variable so that nginx starts even while the backend is
    # down, and looks it up per request through Docker's DNS.
    location ~ ^/(robots\.txt|sitemap\.xml)$ {
        resolver 127.0.0.11 valid=10s;
        set $backend http://backend:8000;
        proxy_set_header Host $http_host;
        proxy_pass $backend;
    }

    # Unknown paths get the app, so client-side routes work on reload.
    location / {
        try_files $uri /index.html;
    }

    # A missing asset is a 404, not the app.
    location /assets/ {
        try_files $uri =404;
    }

    # Files from the server's media folder (the profile photo), mounted by
    # compose.yml. A missing one is a 404, so the site shows its placeholder.
    location /media/ {
        try_files $uri =404;
    }
}
