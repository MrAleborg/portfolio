name: Backend CI

on:
  pull_request:
    paths:
      - "backend/**"
      - "deploy/**"
      - ".github/workflows/backend-ci.yml"
  push:
    branches: [main]
    paths:
      - "backend/**"
      - "deploy/**"
      - ".github/workflows/backend-ci.yml"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      # Settings read these from the environment; backend/.env is not committed.
      SECRET_KEY: ci-insecure-key-not-used-outside-of-tests
      DEBUG: "False"
      PIPENV_VERBOSITY: -1
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pipenv
          cache-dependency-path: backend/Pipfile.lock

      - name: Install dependencies
        run: |
          pip install pipenv
          pipenv install --dev --deploy

      - name: Lint
        run: pipenv run ruff check --output-format=github .

      - name: Check formatting
        run: pipenv run ruff format --check .

      - name: Django system check
        run: pipenv run python manage.py check

      - name: Check for missing migrations
        run: pipenv run python manage.py makemigrations --check --dry-run

      - name: Django deployment check
        # Production-like values, so the check sees the settings the server uses.
        env:
          SECRET_KEY: ci-deploy-check-key-long-and-random-enough-for-django-0123456789abcdef
          ALLOWED_HOSTS: api.example.com
          CSRF_TRUSTED_ORIGINS: https://api.example.com
          EMAIL_URL: smtp+tls://user:password@smtp.example.com:587
        run: pipenv run python manage.py check --deploy --fail-level WARNING

      - name: Run tests
        run: pipenv run pytest --cov --cov-report=term-missing
