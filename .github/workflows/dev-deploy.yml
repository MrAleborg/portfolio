name: Dev deploy

# Deploys a branch to the dev box (Django runserver + Vite, see
# deploy/compose.dev.yml) on each push to a branch other than main, or by hand.
# The box is only on the tailnet: the runner joins it for the job.
# There is one dev box: the last push wins, whatever its branch.
on:
  push:
    # Dependabot's runs get no secrets: they would only fail, and cancel a real
    # deploy (see concurrency).
    branches-ignore: [main, "dependabot/**"]
  workflow_dispatch:

permissions:
  contents: read

# Only the newest push matters: cancel a deploy still running for an older one.
# A cancelled deploy may leave the box stopped until the newer one finishes.
concurrency:
  group: dev-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: Portfolio dev
      url: http://${{ vars.DEV_HOST }}:8080
    env:
      DEV_HOST: ${{ vars.DEV_HOST }}
      DEV_USER: ${{ vars.DEV_USER }}
      DEV_ALLOWED_HOSTS: ${{ vars.DEV_ALLOWED_HOSTS }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Join the tailnet
        # An ephemeral node tagged tag:ci, removed when the job ends. The
        # tailnet policy lets tag:ci reach the dev box (see "Dev box" in
        # backend/docs/deployment.md).
        uses: tailscale/github-action@d1b6cd204f8dceda5b3eaad7f1f767be390056cd # v4.2.0
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci
          ping: ${{ vars.DEV_HOST }}

      - name: Set up SSH
        # As in deploy.yml: secrets through the environment, and the key file
        # created private before the key is written to it.
        env:
          KEY: ${{ secrets.DEV_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DEV_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          install -m 600 /dev/null ~/.ssh/id_ed25519
          printf '%s\n' "$KEY" > ~/.ssh/id_ed25519
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts

      - name: Deploy
        run: deploy/dev-deploy.sh

      - name: Smoke test
        # The containers reinstall their dependencies before they answer: retry
        # for up to 10 minutes per URL. The API first: Vite answers before the
        # backend.
        run: |
          for path in /api/v1/experience/ /; do
            curl --fail --silent --show-error --connect-timeout 5 --max-time 10 \
              --retry 60 --retry-delay 10 --retry-max-time 600 --retry-all-errors \
              "http://$DEV_HOST:8080$path" > /dev/null
          done
