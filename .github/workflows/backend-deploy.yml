name: Backend deploy

# Runs after Backend CI passes on main, or by hand (e.g. to redeploy).
on:
  workflow_run:
    workflows: [Backend CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# One deploy at a time, and never cancel one halfway.
concurrency:
  group: backend-deploy
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/mraleborg/portfolio-backend
  # The commit CI tested (workflow_run), or the one picked by hand.
  COMMIT: ${{ github.event.workflow_run.head_sha || github.sha }}

jobs:
  build:
    if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.COMMIT }}

      - name: Image tag
        id: tag
        run: echo "tag=sha-${COMMIT::7}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: backend
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ steps.tag.outputs.tag }}
            ${{ env.IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://${{ vars.API_DOMAIN }}
    env:
      TAG: ${{ needs.build.outputs.tag }}
      TARGET: ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.COMMIT }}
          sparse-checkout: deploy

      - name: Set up SSH
        run: |
          install -m 700 -d ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/id_ed25519
          echo "${{ secrets.VPS_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/id_ed25519

      - name: Copy the stack files
        # .env stays on the server and is never overwritten.
        run: scp deploy/compose.yml deploy/Caddyfile deploy/backup.sh "$TARGET:/opt/portfolio/"

      - name: Start the new image
        # --wait returns once the backend passes its health check.
        run: |
          # $TAG is expanded here on purpose, to send its value to the server.
          # shellcheck disable=SC2029
          ssh "$TARGET" "cd /opt/portfolio \
            && export TAG=$TAG \
            && docker compose pull backend \
            && docker compose up -d --wait \
            && docker image prune -f"

      - name: Smoke test
        run: curl --fail --silent --show-error --retry 5 --retry-delay 3 --retry-all-errors "https://${{ vars.API_DOMAIN }}/api/v1/experience/" > /dev/null
