name: Deploy

# Deploys the whole Compose stack (backend and frontend) for one commit.
# Runs after Backend CI or Frontend CI passes on main, or by hand on main (e.g.
# to redeploy). Either way, every CI run for the commit must have passed.
on:
  workflow_run:
    workflows: [Backend CI, Frontend CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# One deploy at a time, and never cancel one halfway.
concurrency:
  group: deploy
  cancel-in-progress: false

env:
  # The commit CI tested (workflow_run), or the one picked by hand.
  COMMIT: ${{ github.event.workflow_run.head_sha || github.sha }}

jobs:
  # A push can run both CIs. Deploy only once every CI run for the commit has
  # passed: while another one is still running, its own completion triggers
  # the deploy.
  check:
    if: (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    permissions:
      actions: read
    outputs:
      ready: ${{ steps.ci.outputs.ready }}
      tag: ${{ steps.ci.outputs.tag }}
    steps:
      - name: Check the CI runs for the commit
        id: ci
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "tag=sha-${COMMIT::7}" >> "$GITHUB_OUTPUT"
          runs=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs?head_sha=$COMMIT&event=push" \
            --jq '[.workflow_runs[] | select(.name == "Backend CI" or .name == "Frontend CI")]')
          echo "$runs" | jq -r '.[] | "\(.name): \(.status) \(.conclusion // "")"'
          ready=true
          if [ "$(echo "$runs" | jq '[.[] | select(.status != "completed")] | length')" != 0 ]; then
            echo "::notice::Another CI run is still going; it will trigger the deploy."
            ready=false
          elif [ "$(echo "$runs" | jq '[.[] | select(.conclusion != "success")] | length')" != 0 ]; then
            echo "::warning::A CI run failed for this commit; not deploying."
            ready=false
          elif [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then
            # The commit may have no CI run at all (CI only runs when its
            # paths change), which proves nothing: also require the latest
            # completed run of each CI on main to have passed.
            for workflow in backend-ci.yml frontend-ci.yml; do
              conclusion=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/$workflow/runs?branch=main&status=completed&per_page=1" \
                --jq '.workflow_runs[0].conclusion')
              echo "$workflow, latest completed run on main: $conclusion"
              if [ "$conclusion" != success ]; then
                echo "::warning::The latest $workflow run on main did not succeed; not deploying."
                ready=false
              fi
            done
          fi
          echo "ready=$ready" >> "$GITHUB_OUTPUT"

  build:
    needs: check
    if: needs.check.outputs.ready == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        service: [backend, frontend]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ env.COMMIT }}

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ matrix.service }}
          push: true
          # Lets the deploy prune this repo's old images, and nothing else.
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
          tags: |
            ghcr.io/mraleborg/portfolio-${{ matrix.service }}:${{ needs.check.outputs.tag }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

  deploy:
    needs: [check, build]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: Portfolio production
      url: https://${{ vars.FRONTEND_DOMAIN }}
    env:
      TAG: ${{ needs.check.outputs.tag }}
      TARGET: ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ env.COMMIT }}
          sparse-checkout: deploy

      - name: Set up SSH
        # Secrets go through the environment, not into the script text, and the
        # key file is created private before the key is written to it.
        env:
          KEY: ${{ secrets.VPS_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          install -m 600 /dev/null ~/.ssh/id_ed25519
          printf '%s\n' "$KEY" > ~/.ssh/id_ed25519
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts

      - name: Copy the stack files
        # .env stays on the server and is never overwritten. The server's
        # Caddy config is managed by hand (see deploy/Caddyfile.example).
        run: scp deploy/compose.yml deploy/backup.sh "$TARGET:/opt/portfolio/"

      - name: Start the new images
        # --wait returns once every service passes its health check. Only then
        # is the tag written to .env, so a manual `docker compose` command on
        # the server uses the images that were deployed.
        run: |
          ssh "$TARGET" env TAG="$TAG" REPO="$GITHUB_REPOSITORY" sh -s <<'EOF'
          set -eu
          cd /opt/portfolio
          export TAG
          # The new backend applies migrations when it starts: back up first.
          # Nothing to back up on the first deploy. A stopped backend counts
          # (-a): backup.sh then fails, rather than skipping the backup.
          # </dev/null: docker compose exec forwards stdin, which here is this
          # script, and would eat it.
          if [ -n "$(docker compose ps -a -q backend)" ]; then
              ./backup.sh </dev/null
          fi
          docker compose pull
          if ! docker compose up -d --wait --wait-timeout 180; then
              # The new containers are up but unhealthy: go back to the tag in
              # .env (the last deployed one), if there is one. Not on the
              # first deploy. Migrations may already have been applied.
              if grep -q '^TAG=' .env; then
                  env -u TAG docker compose up -d --wait --wait-timeout 180
              fi
              exit 1
          fi
          # Drop the old TAG line, make sure the file ends with a newline (the
          # file is edited by hand), then add the new one.
          sed -i -e '/^TAG=/d' -e '$a\' .env && echo "TAG=$TAG" >> .env
          # Old sha-* tags stay tagged, so a plain prune removes nothing. Remove
          # the unused images of this repo (a rollback pulls its image again),
          # and only those: the server is shared.
          docker image prune -af \
              --filter "label=org.opencontainers.image.source=https://github.com/$REPO"
          EOF

      - name: Smoke test
        run: |
          curl --fail --silent --show-error --retry 5 --retry-delay 3 --retry-all-errors "https://${{ vars.API_DOMAIN }}/api/v1/experience/" > /dev/null
          curl --fail --silent --show-error --retry 5 --retry-delay 3 --retry-all-errors "https://${{ vars.FRONTEND_DOMAIN }}/" > /dev/null
