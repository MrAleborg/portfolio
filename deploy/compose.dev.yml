# Dev environment for a LAN box (e.g. a Raspberry Pi): Django runserver + Vite.
# Not for production. Started by dev-deploy.sh, which sets DEV_HOST.
services:
  backend:
    image: python:3.12-slim
    working_dir: /app
    volumes:
      - ./backend:/app
    environment:
      SECRET_KEY: dev-only-not-secret
      DEBUG: "True"
      ALLOWED_HOSTS: "*"
      CORS_ALLOWED_ORIGINS: http://${DEV_HOST}:8080
    command: sh -c "pip install -q pipenv && pipenv install --system --deploy --dev && python manage.py migrate --noinput && python manage.py runserver 0.0.0.0:8000"
    ports:
      - "0.0.0.0:8080:5173"
    restart: unless-stopped
  frontend:
    image: node:24-slim
    working_dir: /app
    volumes:
      - ./frontend:/app
      # Install Linux/ARM binaries in the container, not the host's.
      - /app/node_modules
    # Share the backend's network so Vite's /api -> localhost:8000 proxy works.
    network_mode: service:backend
    environment:
      # Vite only answers localhost and IPs; also allow the box's names
      # (DEV_ALLOWED_HOSTS in deploy/.env.dev).
      __VITE_ADDITIONAL_SERVER_ALLOWED_HOSTS: ${DEV_ALLOWED_HOSTS}
    command: sh -c "npm ci && npx vite --host 0.0.0.0 --port 5173"
    restart: unless-stopped
