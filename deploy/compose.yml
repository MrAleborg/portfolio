# Production stack: the Django backend and the frontend, behind the server's
# own Caddy (see Caddyfile.example). Run from this directory, next to a .env
# file (see .env.example). Each deploy writes the image tag it started as TAG in
# that .env, so a manual command uses the deployed images:
#   docker compose up -d
name: portfolio

# Docker keeps container logs forever by default: cap them.
x-logging: &logging
  driver: json-file
  options:
    max-size: 10m
    max-file: "3"

services:
  backend:
    image: ghcr.io/mraleborg/portfolio-backend:${TAG:?set TAG in .env}
    env_file: .env
    ports:
      # Loopback only: Caddy on the host reaches it, the internet can't.
      # (Docker bypasses ufw for ports published on all interfaces.)
      - "127.0.0.1:${BACKEND_PORT:-8000}:8000"
    volumes:
      - db-data:/data
    restart: unless-stopped
    logging: *logging

  frontend:
    image: ghcr.io/mraleborg/portfolio-frontend:${TAG:?set TAG in .env}
    ports:
      # Loopback only, like the backend.
      - "127.0.0.1:${FRONTEND_PORT:-8080}:8080"
    restart: unless-stopped
    logging: *logging

volumes:
  db-data:
