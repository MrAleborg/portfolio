          insomnia.expect(body.is_visible).to.eql(true);
          insomnia.expect(body.display_order).to.eql(0);
          insomnia.expect(body.field_of_study).to.eql({"en": "", "fr": ""});
          insomnia.expect(body.description).to.eql({"en": "", "fr": ""});
