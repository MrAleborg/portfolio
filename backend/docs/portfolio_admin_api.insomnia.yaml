  - url: '{{ _.base_url }}/api/v1/admin/education/'
    name: Create education → 201
    meta:
      id: req_0dc40c9b1fff5f988b645c662a35213a
      created: 1790700000000
      modified: 1790700000000
      isPrivate: false
      description: Response has every field, including display_order, is_visible and timestamps.
      sortKey: 10
    method: POST
    body:
      mimeType: application/json
      text: |-
        {
          "institution": "Université de Rennes",
          "degree": {"en": "Master", "fr": "Master"},
          "field_of_study": {"en": "Computer Science", "fr": "Computer Science"},
          "grade": {"en": "Distinction", "fr": "Distinction"},
          "location": {"en": "Rennes", "fr": "Rennes"},
          "start_date": "2015-09-01",
          "end_date": "2017-06-30",
          "description": {"en": "Created from Insomnia.", "fr": "Created from Insomnia."},
          "display_order": 0,
          "is_visible": true
        }
    headers:
    - name: Content-Type
      value: application/json
    authentication:
      type: bearer
      prefix: Bearer
      token: '{{ _.access }}'
    settings:
      renderRequestBody: true
      encodeUrl: true
      followRedirects: global
      cookies:
        send: true
        store: true
      rebuildPath: true
    scripts:
      afterResponse: |-
        insomnia.test("Status is 201", () => {
          insomnia.expect(insomnia.response.code).to.equal(201);
        });
        const body = insomnia.response.json();
        insomnia.environment.set('education_id', body.id);
        insomnia.test("Returns the internal fields", () => {
          insomnia.expect(body).to.include.keys('display_order', 'is_visible', 'created_at', 'updated_at');
        });
        insomnia.test("Texts are in every language", () => {
          insomnia.expect(body.degree).to.eql({"en": "Master", "fr": "Master"});
          insomnia.expect(body.grade).to.eql({"en": "Distinction", "fr": "Distinction"});
        });
        insomnia.test("Is not current", () => {
          insomnia.expect(body.is_current).to.eql(false);
        });
