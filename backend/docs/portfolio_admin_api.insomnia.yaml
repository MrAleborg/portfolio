type: collection.insomnia.rest/5.0
schema_version: '5.1'
name: Portfolio admin API
meta:
  id: wrk_571ab91cefde5c3186a01fe9ddfc9d6d
  created: 1790700000000
  modified: 1790700000000
  description: 'Tests of the admin API over HTTP. Start the server (`pipenv run python manage.py runserver`), set `password` in the environment, then run the whole collection with the Collection Runner (or `inso run collection`). Each request name ends with the expected status, and its after-response script checks the status and the body.'
collection:
- name: 01. Auth
  meta:
    id: fld_6299c274c1c9548aaa7ddfcbfa17cd00
    created: 1790700000000
    modified: 1790700000000
    sortKey: 1
    description: Login is also sent automatically when the token expires.
  children:
  - url: '{{ _.base_url }}/api/v1/auth/jwt/create/'
    name: Login → 200
    meta:
      id: req_bce1a03b784b5f8b81ba7b6e55a27a0c
      created: 1790700000000
      modified: 1790700000000
      isPrivate: false
      description: Returns `access` and `refresh`. The environment reads `access` from here.
      sortKey: 1
    method: POST
    body:
      mimeType: application/json
      text: |-
        {
          "username": "{{ _.username }}",
          "password": "{{ _.password }}"
        }
    headers:
    - name: Content-Type
      value: application/json
    settings:
      renderRequestBody: true
      encodeUrl: true
      followRedirects: global
      cookies:
        send: true
        store: true
      rebuildPath: true
    scripts:
      afterResponse: |-
        insomnia.test("Status is 200", () => {
          insomnia.expect(insomnia.response.code).to.equal(200);
        });
        const body = insomnia.response.json();
        insomnia.test("Returns both tokens", () => {
          insomnia.expect(body.access).to.be.a('string').and.not.be.empty;
          insomnia.expect(body.refresh).to.be.a('string').and.not.be.empty;
        });
  - url: '{{ _.base_url }}/api/v1/auth/jwt/create/'
    name: Login with a wrong password → 401
    meta:
      id: req_e25f1a5961d5583cbd0989e32cd7a3fb
      created: 1790700000000
      modified: 1790700000000
      isPrivate: false
      description: ''
      sortKey: 2
    method: POST
    body:
      mimeType: application/json
      text: |-
        {
          "username": "{{ _.username }}",
          "password": "wrong"
        }
    headers:
    - name: Content-Type
      value: application/json
    settings:
      renderRequestBody: true
      encodeUrl: true
      followRedirects: global
      cookies:
        send: true
        store: true
      rebuildPath: true
    scripts:
      afterResponse: |-
        insomnia.test("Status is 401", () => {
          insomnia.expect(insomnia.response.code).to.equal(401);
        });
        const body = insomnia.response.json();
        insomnia.test("No token is returned", () => {
          insomnia.expect(body).to.not.have.property("access");
          insomnia.expect(body).to.have.property('detail');
        });
  - url: '{{ _.base_url }}/api/v1/auth/users/me/'
    name: Current user → 200
    meta:
      id: req_8833e1b95d915d9d952d15be1df539d1
      created: 1790700000000
      modified: 1790700000000
      isPrivate: false
      description: ''
      sortKey: 3
    method: GET
    authentication:
      type: bearer
      prefix: Bearer
      token: '{{ _.access }}'
    settings:
      renderRequestBody: true
      encodeUrl: true
      followRedirects: global
      cookies:
        send: true
        store: true
      rebuildPath: true
    scripts:
      afterResponse: |-
        insomnia.test("Status is 200", () => {
          insomnia.expect(insomnia.response.code).to.equal(200);
        });
        const body = insomnia.response.json();
        insomnia.test("Returns the logged-in user", () => {
          insomnia.expect(body.username).to.be.a('string').and.not.be.empty;
        });
