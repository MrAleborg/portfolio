[lint]
ignore = [
    # Mutable class defaults: Django and DRF declare Meta options
    # (fields, ordering, constraints) as lists that are only read.
    "RUF012",
]

[format]
exclude = [
    # Keep the hand-aligned code samples in docs/ as written.
    "*.md",
    # Generated by makemigrations in Django's own style.
    "*/migrations/*",
]
